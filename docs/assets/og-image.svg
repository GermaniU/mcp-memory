<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1a1f"/>
      <stop offset="1" stop-color="#11222a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.32" r="0.45">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="100" height="120" patternUnits="userSpaceOnUse">
      <path d="M100 0V120M0 120H100" stroke="#ffffff" stroke-opacity="0.035" fill="none"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- memory mark: stacked records with a search lens -->
  <g transform="translate(935 205)">
    <g fill="none" stroke-width="6">
      <ellipse cx="0" cy="-78" rx="92" ry="26" stroke="#34d399" stroke-opacity="0.9"/>
      <path d="M-92 -78V-18M92 -78V-18" stroke="#34d399" stroke-opacity="0.75"/>
      <path d="M-92 -18A92 26 0 0 0 92 -18" stroke="#2dd4bf" stroke-opacity="0.8"/>
      <path d="M-92 -18V42M92 -18V42" stroke="#2dd4bf" stroke-opacity="0.6"/>
      <path d="M-92 42A92 26 0 0 0 92 42" stroke="#38bdf8" stroke-opacity="0.7"/>
      <path d="M-92 42V102M92 42V102" stroke="#38bdf8" stroke-opacity="0.5"/>
      <path d="M-92 102A92 26 0 0 0 92 102" stroke="#60a5fa" stroke-opacity="0.6"/>
    </g>
    <g transform="translate(78 70)">
      <circle r="40" fill="#0d1a1f" stroke="#60a5fa" stroke-width="7"/>
      <path d="M28 28L62 62" stroke="#60a5fa" stroke-width="10" stroke-linecap="round"/>
      <text x="0" y="9" text-anchor="middle" font-family="'JetBrains Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="24" font-weight="700" fill="#34d399">BM25</text>
    </g>
  </g>

  <g font-family="Inter, 'Helvetica Neue', Arial, 'DejaVu Sans', sans-serif">
    <rect x="80" y="78" width="14" height="14" rx="3" fill="url(#title)"/>
    <text x="108" y="92" font-size="19" letter-spacing="2" fill="#94a3b8">OPEN SOURCE · MIT · MCP SERVER</text>

    <text x="76" y="222" font-size="112" font-weight="800" fill="#ffffff">MCP</text>
    <text x="76" y="338" font-size="112" font-weight="800" fill="url(#title)">Memory</text>

    <text x="80" y="398" font-size="27" font-weight="600" fill="#e2e8f0">Memoria persistente para tu agente IA, en tu máquina.</text>
    <text x="80" y="436" font-size="20" fill="#94a3b8">SQLite + FTS5 · búsqueda BM25 · 9 tools · cero infra externa · Python.</text>

    <g font-size="17" fill="#e2e8f0">
      <rect x="80" y="470" width="122" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="141" y="495" text-anchor="middle">Claude Code</text>
      <rect x="212" y="470" width="96" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="260" y="495" text-anchor="middle">Cursor</text>
      <rect x="318" y="470" width="120" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="378" y="495" text-anchor="middle">OpenCode</text>
      <rect x="448" y="470" width="110" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="503" y="495" text-anchor="middle">Continue</text>
      <rect x="568" y="470" width="82" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="609" y="495" text-anchor="middle" fill="#34d399">+ MCP</text>
    </g>

    <line x1="80" y1="560" x2="1120" y2="560" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="80" y="595" font-family="'JetBrains Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="20" fill="#94a3b8">github.com/GermaniU/mcp-memory</text>
    <text x="1120" y="595" text-anchor="end" font-size="20" font-weight="600" fill="#34d399">@GermaniU</text>
  </g>
</svg>
