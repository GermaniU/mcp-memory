[project]
name = "mcp-memory"
version = "0.4.0"
description = "Local agent memory exposed via MCP. SQLite + FTS5 (BM25 lexical search), cero infra externa. Drop-in for Claude Code, OpenCode, Cursor, Continue."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Germani Asesino" }]

dependencies = [
    "fastmcp>=2.5.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]

[project.scripts]
mcp-memory = "mcp_memory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_memory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
# El marker "integration" se elimina (TKT-1470): con SQLite + FTS5,
# tests/integration/test_e2e.py corre sin ningún servicio externo — deja
# de tener sentido distinguirlo de tests/unit vía marker de skip.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
