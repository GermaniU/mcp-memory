name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # pip < 26.2.2 trusts the compromised emSign ECC Root CA - G3 through its
  # vendored certifi (eMudhra incident). The runner's pip is replaced with a
  # hash-pinned wheel before anything else is downloaded.
  PIP_BOOTSTRAP: "pip @ https://files.pythonhosted.org/packages/3f/06/3e4420302363fbb71be3c7f35ce042f54bfca330e3e66b3a2e3c4cca579f/pip-26.2.2-py3-none-any.whl#sha256=fd7f4dfa8190e014013b9f08f3e973f4e4c26ffd179a204895533a7254813a70"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          # Sin requirements*.txt en el repo, cache:pip necesita el path explícito.
          cache-dependency-path: server/pyproject.toml

      - name: Bootstrap pip >= 26.2.2 (hash-pinned)
        run: |
          python -m pip install --no-deps "$PIP_BOOTSTRAP"
          python -m pip --version

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check src tests scripts

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Bootstrap pip >= 26.2.2 (hash-pinned)
        run: |
          python -m pip install --no-deps "$PIP_BOOTSTRAP"
          python -m pip --version

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: pytest (unit)
        run: pytest tests/unit -q

      # E2E real contra SQLite/FTS5 + cliente FastMCP in-memory: sin servicios
      # externos, así que corre en cada versión de Python de la matriz.
      - name: pytest (integration)
        run: pytest tests/integration -q

  audit:
    name: Auditoría de dependencias (pip-audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      # pip-audit resolves the project in a throwaway venv seeded by ensurepip and
      # upgrades pip there with that seeded pip. 3.13.17 is the first 3.13 build
      # whose bundled pip is 26.2.2, so that step does not run on the old trust store.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.17"
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: ensurepip trae pip >= 26.2.2
        run: |
          python - <<'EOF'
          import ensurepip
          v = tuple(int(x) for x in ensurepip.version().split(".")[:3])
          assert v >= (26, 2, 2), f"ensurepip bundles pip {ensurepip.version()}"
          print("ensurepip pip", ensurepip.version())
          EOF

      - name: Bootstrap pip >= 26.2.2 (hash-pinned)
        run: |
          python -m pip install --no-deps "$PIP_BOOTSTRAP"
          python -m pip --version

      # pip-audit queries the vulnerability services through requests/certifi.
      - name: Instalar pip-audit
        run: pip install pip-audit "certifi>=2026.10.19"

      # Modo proyecto: audita solo las dependencias declaradas en pyproject.toml
      # (resueltas en un entorno aislado), no las herramientas preinstaladas del
      # runner como setuptools.
      - name: pip-audit (dependencias del proyecto)
        run: pip-audit .

  docker:
    name: Build de la imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: docker build
        run: docker build --pull --no-cache -t mcp-memory:ci server

      - name: Smoke test del contenedor (healthcheck + usuario sin privilegios)
        run: |
          docker run -d --name mcp-memory -p 127.0.0.1:8765:8765 mcp-memory:ci
          for i in $(seq 1 20); do curl -fs localhost:8765/health && break; sleep 1; done
          curl -fs localhost:8765/health
          test "$(docker exec mcp-memory id -u)" != "0"
          # Neither pip, its vendored certifi nor a transitive certifi (fastmcp pulls
          # one in) may predate the eMudhra fix.
          docker exec -i mcp-memory python - <<'EOF'
          import importlib.util
          import pip
          import pip._vendor.certifi as vendored
          def v(s):
              return tuple(int(x) for x in s.split(".")[:3])
          assert v(pip.__version__) >= (26, 2, 2), pip.__version__
          assert v(vendored.__version__) >= (2026, 10, 19), vendored.__version__
          print("pip", pip.__version__, "vendored certifi", vendored.__version__)
          if importlib.util.find_spec("certifi"):
              import certifi
              assert v(certifi.__version__) >= (2026, 10, 19), certifi.__version__
              print("certifi", certifi.__version__)
          EOF
          # El HEALTHCHECK del Dockerfile debe reportar "healthy" (tarda un intervalo).
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' mcp-memory)"
            [ "$status" = "healthy" ] && break
            sleep 1
          done
          test "$status" = "healthy"

      # Así lo lanzan los clientes stdio (y el MCP Registry): `docker run -i --rm <imagen> --stdio`.
      # Al cerrarse stdin el server termina, así que la respuesta llega sin colgar el job.
      - name: Smoke test stdio del contenedor
        run: |
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 60 docker run -i --rm mcp-memory:ci --stdio > stdio.out
          cat stdio.out
          grep -q '"protocolVersion"' stdio.out

      # El MCP Registry rechaza la imagen si el label no coincide con server.json.
      - name: Label del MCP Registry coincide con server.json
        run: |
          label="$(docker inspect -f '{{ index .Config.Labels "io.modelcontextprotocol.server.name" }}' mcp-memory:ci)"
          test "$label" = "$(jq -r .name server.json)"
